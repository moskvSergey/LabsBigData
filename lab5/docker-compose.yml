# ЛР-5. Потоковая обработка данных. Стенд целиком.
#
# Вариант 8 -> уникальное требование: p99 end-to-end задержки < 45 мс.
# Датасет: MovieLens ml-32m (ЛР-1), сценарий: рекомендательная система.
#
# Запуск:  docker compose up -d --build
# Проверка: docker compose logs -f monitor        (там печатается ## METRICS ##)
#           docker compose run --rm tests        (автоматические проверки)
#
# Kafka поднимается в режиме KRaft (без ZooKeeper).
# Два слушателя: INTERNAL (kafka:29092, для контейнеров) и EXTERNAL (localhost:9092, для хоста).

services:

  # ---------------------------------------------------------------- Kafka
  kafka:
    image: apache/kafka:3.9.0
    container_name: lab5-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 20

  # Создание топиков
  kafka-init:
    image: apache/kafka:3.9.0
    container_name: lab5-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./kafka/topics:/opt/topics:ro
    entrypoint: ["/bin/bash", "/opt/topics/init.sh"]

  # ---------------------------------------------------------------- Feature store
  redis:
    image: redis:7.2-alpine
    container_name: lab5-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 20

  # Загрузка online-фич в Redis
  redis-init:
    image: python:3.11-slim
    container_name: lab5-redis-init
    depends_on:
      redis:
        condition: service_healthy
    environment:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    volumes:
      - ./feature_store/redis:/opt/feature_store:ro
      - ./work:/opt/work:ro
    entrypoint: >
      bash -c "pip install --quiet redis==5.2.1 &&
               python /opt/feature_store/load_features.py --host redis --dump /opt/work/feature_store.json"

  # ---------------------------------------------------------------- Flink
  # Официальный образ Flink сбрасывает root -> пользователя flink (uid 9999)
  # через gosu, поэтому именованный том под checkpoint'ы надо подготовить.
  flink-init:
    image: lab5-flink:1.20.1
    container_name: lab5-flink-init
    user: root
    entrypoint:
      - bash
      - -c
      - "mkdir -p /opt/flink/checkpoints && chown -R 9999:9999 /opt/flink/checkpoints && chmod -R 777 /opt/flink/checkpoints && echo 'checkpoint-том готов'"
    volumes:
      - flink-checkpoints:/opt/flink/checkpoints

  flink-jobmanager:
    build:
      context: ./flink
      dockerfile: Dockerfile
    image: lab5-flink:1.20.1
    container_name: lab5-flink-jobmanager
    command: jobmanager
    depends_on:
      flink-init:
        condition: service_completed_successfully
    ports:
      - "8081:8081"     # Flink Web UI
      - "9250:9250"     # Prometheus metrics
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        jobmanager.memory.process.size: 1200m
        taskmanager.memory.process.size: 1600m
        parallelism.default: 2
        state.backend.type: hashmap
        state.checkpoints.dir: file:///opt/flink/checkpoints
        execution.checkpointing.mode: EXACTLY_ONCE
        python.fn-execution.bundle.size: 50
        python.fn-execution.bundle.time: 10
        python.fn-execution.memory.managed: false
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9250
    volumes:
      - ./flink/jobs:/opt/jobs
      - ./models:/opt/models:ro
      - flink-checkpoints:/opt/flink/checkpoints

  flink-taskmanager:
    build:
      context: ./flink
      dockerfile: Dockerfile
    image: lab5-flink:1.20.1
    container_name: lab5-flink-taskmanager
    command: taskmanager
    depends_on:
      flink-init:
        condition: service_completed_successfully
      flink-jobmanager:
        condition: service_started
    ports:
      - "9251:9251"     # Prometheus metrics
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        jobmanager.memory.process.size: 1200m
        taskmanager.memory.process.size: 1600m
        taskmanager.numberOfTaskSlots: 4
        parallelism.default: 2
        state.backend.type: hashmap
        state.checkpoints.dir: file:///opt/flink/checkpoints
        execution.checkpointing.mode: EXACTLY_ONCE
        python.fn-execution.bundle.size: 50
        python.fn-execution.bundle.time: 10
        python.fn-execution.memory.managed: false
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9251
    volumes:
      - ./flink/jobs:/opt/jobs
      - ./models:/opt/models:ro
      - flink-checkpoints:/opt/flink/checkpoints

  # Отправка задания в кластер (одноразовый контейнер)
  flink-submit:
    image: lab5-flink:1.20.1
    container_name: lab5-flink-submit
    depends_on:
      flink-init:
        condition: service_completed_successfully
      flink-jobmanager:
        condition: service_started
      flink-taskmanager:
        condition: service_started
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      REDIS_HOST: redis
      MODEL_PATH: /opt/models/recommender.onnx
      FEATURE_JSON: /opt/models/feature_store.json
      FEATURE_MODE: warm
      CHECKPOINT_DIR: file:///opt/flink/checkpoints
      DECISION_THRESHOLD: "0.372844"
      MODEL_VERSION: "recommender.onnx:v1"
      # Размер/время «бандла» Python-воркера PyFlink: именно они определяют
      # постоянную добавку к задержке (по умолчанию 1000 мс на каждый оператор).
      PY_BUNDLE_SIZE: "50"
      PY_BUNDLE_TIME_MS: "10"
      # Эти настройки PyFlink читает на КЛИЕНТЕ при построении графа задания,
      # поэтому они должны быть и здесь, а не только на jobmanager/taskmanager.
      FLINK_PROPERTIES: |
        python.fn-execution.bundle.size: 50
        python.fn-execution.bundle.time: 10
        python.fn-execution.memory.managed: false
    volumes:
      - ./flink/jobs:/opt/jobs
      - ./models:/opt/models:ro
      - flink-checkpoints:/opt/flink/checkpoints
    entrypoint: >
      bash -c "
      echo 'Ожидание JobManager...';
      for i in $$(seq 1 60); do
        curl -sf http://flink-jobmanager:8081/overview >/dev/null && break;
        sleep 2;
      done;
      echo 'Отмена ранее запущенных заданий (идемпотентность docker compose up)...';
      python3 /opt/jobs/cancel_running.py http://flink-jobmanager:8081;
      echo 'Отправка PyFlink-задания...';
      flink run --jobmanager flink-jobmanager:8081 --python /opt/jobs/recommender_stream.py;
      "

  # ---------------------------------------------------------------- ML model server
  model-server:
    build:
      context: ./model_server
      dockerfile: Dockerfile
    image: lab5-model-server:1.0
    container_name: lab5-model-server
    ports:
      # 8000 на хосте занят другим проектом, поэтому публикуем на 8010
      - "8010:8000"
    volumes:
      - ./models:/opt/models:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 5s
      timeout: 5s
      retries: 20

  # ---------------------------------------------------------------- Нагрузка
  load-generator:
    build:
      context: ./load_generator
      dockerfile: Dockerfile
    image: lab5-load-generator:1.0
    container_name: lab5-load-generator
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      flink-submit:
        condition: service_started
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      RATINGS_PATH: /opt/dataset/ratings_100mb.parquet
      WAIT_FOR_FLINK: http://flink-jobmanager:8081
    volumes:
      - ./work:/opt/work
      - ../lab2/work:/opt/dataset:ro
    command: ["python", "generator.py", "--bootstrap", "kafka:29092",
              "--mode", "normal", "--rate", "200", "--count", "3000",
              "--wait-for-flink", "http://flink-jobmanager:8081"]

  # ---------------------------------------------------------------- Мониторинг
  monitor:
    image: python:3.11-slim
    container_name: lab5-monitor
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      REQUIRED_LATENCY_MS: "45"
      RUN_SECONDS: "90"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    ports:
      - "8001:8001"     # /metrics для Prometheus
    volumes:
      - ./monitoring:/opt/monitoring:ro
      - ./work:/opt/work
    entrypoint: >
      bash -c "pip install --quiet kafka-python==2.2.15 prometheus-client==0.21.1 numpy==1.26.4 &&
               python /opt/monitoring/monitor.py"

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: lab5-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    depends_on:
      - monitor

  grafana:
    image: grafana/grafana:11.1.0
    container_name: lab5-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

  # ---------------------------------------------------------------- Тесты
  tests:
    image: python:3.11-slim
    container_name: lab5-tests
    profiles: ["tests"]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      REQUIRED_LATENCY_MS: "45"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    volumes:
      - ./tests:/opt/tests:ro
      - ./work:/opt/work
    entrypoint: >
      bash -c "pip install --quiet kafka-python==2.2.15 numpy==1.26.4 pytest==8.3.4 &&
               python -m pytest -v -s -p no:cacheprovider /opt/tests"

volumes:
  flink-checkpoints:
