global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: lab5-monitor
    static_configs:
      - targets: ["monitor:8001"]

  - job_name: lab5-model-server
    static_configs:
      - targets: ["model-server:8000"]

  - job_name: flink-jobmanager
    static_configs:
      - targets: ["flink-jobmanager:9250"]

  - job_name: flink-taskmanager
    static_configs:
      - targets: ["flink-taskmanager:9251"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
