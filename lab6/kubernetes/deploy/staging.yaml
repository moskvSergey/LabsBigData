# ЛР-6, Часть 4, п.4. Staging-окружение: сюда катится новая версия до прода.
apiVersion: v1
kind: Namespace
metadata:
  name: lab6-staging
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-server
  namespace: lab6-staging
  labels:
    app: model-server
    version: canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: model-server
  template:
    metadata:
      labels:
        app: model-server
        version: canary
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
    spec:
      containers:
        - name: model-server
          image: lab6-model-server:1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: MODEL_VERSION
              value: lab6-lr-1.0-rc
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: model-server
  namespace: lab6-staging
spec:
  selector:
    app: model-server
  ports:
    - port: 80
      targetPort: 8000
