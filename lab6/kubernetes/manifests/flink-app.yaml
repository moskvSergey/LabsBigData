# ЛР-6, Часть 2. Flink Operator (flink-kubernetes-operator) + FlinkDeployment.
#
# JobManager и TaskManager'ы — stateful-нагрузка реального времени (инференс),
# поэтому живут на on-demand и с savepoint'ами; batch-часть уходит на spot
# через KEDA (kubernetes/keda/scaledobject.yaml).
#
# Валидация без кластера: kubectl apply --dry-run=client -f kubernetes/manifests/flink-app.yaml
---
apiVersion: v1
kind: Namespace
metadata:
  name: flink
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flink-operator
  namespace: flink
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: flink-operator-role
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "events", "secrets"]
    verbs: ["*"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["*"]
  - apiGroups: ["flink.apache.org"]
    resources: ["flinkdeployments", "flinksessionjobs", "flinkstates"]
    verbs: ["*"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: flink-operator-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: flink-operator-role
subjects:
  - kind: ServiceAccount
    name: flink-operator
    namespace: flink
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flink-kubernetes-operator
  namespace: flink
  labels:
    app: flink-kubernetes-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flink-kubernetes-operator
  template:
    metadata:
      labels:
        app: flink-kubernetes-operator
    spec:
      serviceAccountName: flink-operator
      containers:
        - name: operator
          image: ghcr.io/apache/flink-kubernetes-operator:1.9.0
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
# StatefulSet для TaskManager'ов с persistent volume (Часть 2, п.3).
# Нужен, когда state не влезает в heap и локальный диск должен переживать рестарт.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: flink-taskmanager
  namespace: flink
spec:
  serviceName: flink-taskmanager
  replicas: 3
  selector:
    matchLabels:
      app: flink
      component: taskmanager
  template:
    metadata:
      labels:
        app: flink
        component: taskmanager
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values: ["flink"]
              topologyKey: "kubernetes.io/hostname"
      containers:
        - name: taskmanager
          image: flink:1.20.1-scala_2.12-java17
          command: ["/bin/sh", "-c"]
          args: ["exec /docker-entrypoint.sh taskmanager"]
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          volumeMounts:
            - name: flink-storage
              mountPath: /opt/flink/state
  volumeClaimTemplates:
    - metadata:
        name: flink-storage
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: standard
        resources:
          requests:
            storage: 10Gi
---
apiVersion: flink.apache.org/v1beta1
kind: FlinkDeployment
metadata:
  name: flink-production
  namespace: flink
spec:
  image: flink:1.20.1-scala_2.12-java17
  flinkVersion: v1_20
  serviceAccount: flink-operator
  flinkConfiguration:
    taskmanager.numberOfTaskSlots: "2"
    # Метрики в Prometheus (Часть 5)
    metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
    metrics.reporter.prom.port: "9249"
    # Fault tolerance: при вытеснении узла задача поднимается с checkpoint'а
    execution.checkpointing.interval: "30s"
    execution.checkpointing.mode: EXACTLY_ONCE
    state.backend: rocksdb
    state.checkpoints.dir: file:///opt/flink/checkpoints
    state.savepoints.dir: file:///opt/flink/savepoints
    restart-strategy: exponential-delay
  jobManager:
    resource:
      memory: "2048m"
      cpu: 1
    replicas: 1
    podTemplate:
      spec:
        nodeSelector:
          node-pool: on-demand
        containers:
          - name: jobmanager
            resources:
              requests:
                cpu: "1"
                memory: "2Gi"
              limits:
                cpu: "2"
                memory: "3Gi"
  taskManager:
    resource:
      memory: "4096m"
      cpu: 2
    replicas: 3
    podTemplate:
      spec:
        nodeSelector:
          node-pool: on-demand
        affinity:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchExpressions:
                    - key: component
                      operator: In
                      values: ["taskmanager"]
                topologyKey: "kubernetes.io/hostname"
  job:
    jarURI: local:///opt/flink/examples/streaming/WindowJoin.jar
    parallelism: 8
    upgradeMode: savepoint
    state: running
