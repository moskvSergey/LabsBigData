# ЛР-6, Часть 5. Дашборды Grafana (provisioning).

apiVersion: 1

providers:
  - name: lab6
    orgId: 1
    folder: "ЛР-6"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
