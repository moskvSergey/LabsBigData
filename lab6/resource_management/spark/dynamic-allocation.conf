# ЛР-6, Часть 3, п.2. Dynamic allocation для Spark.
#
# Платим только за те executor'ы, которые реально нужны прямо сейчас.
# Именно этот механизм даёт основную часть экономии варианта 8:
# в простое кластер сжимается до minExecutors, на всплеске — до maxExecutors.

spark.dynamicAllocation.enabled=true
spark.dynamicAllocation.minExecutors=2
spark.dynamicAllocation.maxExecutors=20
spark.dynamicAllocation.initialExecutors=4
spark.dynamicAllocation.executorIdleTimeout=60s
spark.dynamicAllocation.cachedExecutorIdleTimeout=300s
spark.dynamicAllocation.schedulerBacklogTimeout=5s
spark.dynamicAllocation.sustainedSchedulerBacklogTimeout=10s
# Shuffle tracking избавляет от отдельного External Shuffle Service
spark.dynamicAllocation.shuffleTracking.enabled=true
spark.dynamicAllocation.shuffleTracking.timeout=300s

# Память: 0.6 от heap на исполнение+кэш, остальное — на служебные структуры.
# Overhead вынесен явно, иначе JVM выходит за cgroup-лимит пода и получает OOMKilled.
spark.memory.fraction=0.6
spark.memory.storageFraction=0.5
spark.executor.memoryOverhead=1g
spark.driver.memoryOverhead=1g

# AQE сам укрупняет/дробит партиции — меньше executor-часов на shuffle.
spark.sql.adaptive.enabled=true
spark.sql.adaptive.coalescePartitions.enabled=true
spark.sql.adaptive.advisoryPartitionSizeInBytes=128m
spark.sql.shuffle.partitions=200

# Spot-специфика: задача переживает вытеснение узла без потери данных.
spark.speculation=false
spark.task.maxFailures=4
spark.stage.maxConsecutiveAttempts=4
spark.shuffle.useOldFetchProtocol=false
